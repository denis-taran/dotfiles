name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - run: |
          files=".bashrc .bash_profile .profile $(shfmt -f .)"
          shellcheck -e SC1091 $files
          shfmt -d $files
